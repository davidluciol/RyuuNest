<!-- SCRIPT DE MICRO-INTERACCIONES (HUD, NAVEGACIÓN Y AJUSTES) -->
<script>
    let hudVisible = true;
    let isBookmarked = false;
    let currentPage = 18;
    const totalPages = 42;

    function toggleHUD() {
      hudVisible = !hudVisible;
      const topHud = document.getElementById('top-hud');
      const bottomHud = document.getElementById('bottom-hud');
      const counterPill = document.getElementById('page-counter-pill');

      if (hudVisible) {
        topHud.classList.remove('-translate-y-full');
        bottomHud.classList.remove('translate-y-full');
        counterPill.classList.remove('opacity-40');
        counterPill.classList.add('opacity-90');
      } else {
        topHud.classList.add('-translate-y-full');
        bottomHud.classList.add('translate-y-full');
        counterPill.classList.remove('opacity-90');
        counterPill.classList.add('opacity-40');
      }
    }

    function toggleBookmark() {
      isBookmarked = !isBookmarked;
      const icon = document.getElementById('bookmark-icon');
      const btn = document.getElementById('bookmark-btn');
      if (isBookmarked) {
        icon.style.fontVariationSettings = "'FILL' 1";
        btn.classList.add('text-secondary-fixed');
        btn.classList.remove('text-text-secondary');
      } else {
        icon.style.fontVariationSettings = "'FILL' 0";
        btn.classList.remove('text-secondary-fixed');
        btn.classList.add('text-text-secondary');
      }
    }

    function updateScrubber(val) {
      currentPage = parseInt(val, 10);
      const percent = Math.round((currentPage / totalPages) * 100);
      document.getElementById('hud-page-indicator').textContent = currentPage;
      document.getElementById('floating-current-page').textContent = currentPage;
      document.getElementById('hud-percentage').textContent = percent + '%';
    }

    function changePage(delta) {
      let next = currentPage + delta;
      if (next < 1) next = 1;
      if (next > totalPages) next = totalPages;
      const slider = document.getElementById('reading-progress-slider');
      slider.value = next;
      updateScrubber(next);
    }

    function handleTapZone(zone) {
      if (zone === 'prev') {
        changePage(-1);
      } else if (zone === 'next') {
        changePage(1);
      }
    }

    function toggleSettingsDrawer() {
      const drawer = document.getElementById('settings-drawer');
      const backdrop = document.getElementById('settings-backdrop');
      const isOpen = !drawer.classList.contains('translate-y-full');

      if (isOpen) {
        drawer.classList.add('translate-y-full');
        backdrop.classList.add('opacity-0', 'pointer-events-none');
        backdrop.classList.remove('opacity-100', 'pointer-events-auto');
      } else {
        drawer.classList.remove('translate-y-full');
        backdrop.classList.remove('opacity-0', 'pointer-events-none');
        backdrop.classList.add('opacity-100', 'pointer-events-auto');
      }
    }

    function setReadingMode(mode) {
      const btnWebtoon = document.getElementById('btn-mode-webtoon');
      const btnPaged = document.getElementById('btn-mode-paged');

      if (mode === 'webtoon') {
        btnWebtoon.className = "px-3 py-1 rounded-full font-label-sm text-label-sm font-semibold flex items-center gap-1.5 bg-badge-bg text-primary shadow-sm transition-colors";
        btnPaged.className = "px-3 py-1 rounded-full font-label-sm text-label-sm font-medium flex items-center gap-1.5 text-text-secondary hover:text-text-primary transition-colors";
      } else {
        btnPaged.className = "px-3 py-1 rounded-full font-label-sm text-label-sm font-semibold flex items-center gap-1.5 bg-badge-bg text-primary shadow-sm transition-colors";
        btnWebtoon.className = "px-3 py-1 rounded-full font-label-sm text-label-sm font-medium flex items-center gap-1.5 text-text-secondary hover:text-text-primary transition-colors";
      }
    }

    function setReadingDirection(dir) {
      const dirs = ['rtl', 'ltr', 'vert'];
      dirs.forEach(d => {
        const el = document.getElementById('dir-' + d);
        if (d === dir) {
          el.className = "py-2.5 px-2 rounded-xl bg-badge-bg text-primary flex flex-col items-center justify-center gap-1 transition-colors";
          el.querySelector('span:last-child').classList.add('font-semibold');
          el.querySelector('span:last-child').classList.remove('font-medium');
        } else {
          el.className = "py-2.5 px-2 rounded-xl bg-surface text-text-secondary hover:text-text-primary flex flex-col items-center justify-center gap-1 transition-colors";
          el.querySelector('span:last-child').classList.remove('font-semibold');
          el.querySelector('span:last-child').classList.add('font-medium');
        }
      });
    }

    function nextChapter() {
      // Feedback visual para salto de capítulo
      const topHud = document.getElementById('top-hud');
      topHud.classList.add('ring-2', 'ring-primary');
      setTimeout(() => {
        topHud.classList.remove('ring-2', 'ring-primary');
      }, 400);
    }
  </script>
</div></main></body></html>
