<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estados vacíos a pantalla completa — Dragon Night (FB2)</title>
  <link rel="stylesheet" href="../_shared/dragon-night.css">
  <style>
    body { display: block; padding: 24px; }
    .sheet { display: flex; gap: 24px; justify-content: center; }
    .frame { width: 390px; height: 720px; border: 1px solid var(--border); background: var(--bg); display: flex; flex-direction: column; }
    .frame .cap { padding: 12px 16px; border-bottom: 1px solid var(--border); font: 600 12px/16px "Inter", sans-serif; letter-spacing: .04em; text-transform: uppercase; color: var(--text-2); }
    .frame .empty { padding-top: 0; }
  </style>
</head>
<body>
  <div class="sheet">
    <section class="frame" aria-label="Biblioteca vacía">
      <div class="cap">Biblioteca</div>
      <div class="empty">
        <svg width="96" height="96" viewBox="0 0 96 96" fill="none" role="img" aria-label="Dragón marcador" style="color:var(--text-2)">
          <path d="M24 22 C34 12 48 14 55 25 C61 34 56 45 45 49 C36 52 30 58 32 67 C34 77 46 82 57 75" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
          <path d="M31 14 L36 4 L40 16 Z" fill="currentColor"/><path d="M25 20 L11 25 L23 32 Z" fill="currentColor"/>
          <path d="M47 31 L72 18 L65 42 Z" fill="currentColor"/><path d="M57 75 L74 77 L62 86 Z" fill="currentColor"/>
        </svg>
        <h2>Tu biblioteca está vacía</h2>
        <p>Añade un repositorio e instala un módulo para empezar.</p>
        <button class="btn primary">Añadir repositorio</button>
      </div>
    </section>

    <section class="frame" aria-label="Descubrir sin portales">
      <div class="cap">Descubrir</div>
      <div class="empty">
        <svg width="96" height="96" viewBox="0 0 96 96" fill="none" role="img" aria-label="Dragón marcador" style="color:var(--text-2)">
          <path d="M24 22 C34 12 48 14 55 25 C61 34 56 45 45 49 C36 52 30 58 32 67 C34 77 46 82 57 75" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
          <path d="M31 14 L36 4 L40 16 Z" fill="currentColor"/><path d="M25 20 L11 25 L23 32 Z" fill="currentColor"/>
          <path d="M47 31 L72 18 L65 42 Z" fill="currentColor"/><path d="M57 75 L74 77 L62 86 Z" fill="currentColor"/>
        </svg>
        <h2>Todavía no hay portales</h2>
        <p>Añade un repositorio e instala un módulo para descubrir obras.</p>
        <button class="btn primary">Añadir repositorio</button>
      </div>
    </section>

    <section class="frame" aria-label="Sin resultados">
      <div class="cap">Búsqueda</div>
      <div class="empty">
        <svg width="64" height="64" viewBox="0 0 96 96" fill="none" role="img" aria-label="Dragón marcador" style="color:var(--text-2)">
          <path d="M24 22 C34 12 48 14 55 25 C61 34 56 45 45 49 C36 52 30 58 32 67 C34 77 46 82 57 75" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
          <path d="M31 14 L36 4 L40 16 Z" fill="currentColor"/><path d="M25 20 L11 25 L23 32 Z" fill="currentColor"/>
          <path d="M47 31 L72 18 L65 42 Z" fill="currentColor"/><path d="M57 75 L74 77 L62 86 Z" fill="currentColor"/>
        </svg>
        <h2>Sin resultados</h2>
        <p>Ningún resultado para «cenizas». Prueba con otra palabra.</p>
        <button class="btn primary">Explorar de nuevo</button>
      </div>
    </section>
  </div>
</body>
</html>
