<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar acción destructiva · hoja inferior (móvil) — Dragon Night (F34)</title>
  <link rel="stylesheet" href="../_shared/dragon-night.css">
  <style>
    .sheetscrim { position: absolute; inset: 0; background: rgba(11, 14, 20, .64); display: flex; align-items: flex-end; }
    .sheet { width: 100%; background: var(--elevated); border: 1px solid var(--border); border-bottom: 0; border-radius: 16px 16px 0 0; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
    .grab { width: 40px; height: 4px; border-radius: 9999px; background: var(--border); align-self: center; }
    .sheet h2 { font: 700 18px/24px "Manrope", sans-serif; }
    .sheet p { font-size: 14px; line-height: 20px; color: var(--text-2); }
    .subject { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font: 500 14px/20px "Inter", sans-serif; }
    .stack { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: center; gap: 12px; padding: 16px; border-top: 1px solid var(--border); font-size: 14px; }
    .row:first-child { border-top: 0; }
  </style>
</head>
<body>
  <div class="phone" style="overflow:hidden;max-height:100vh">
    <header class="topbar">
      <h1 style="padding-left:12px">Ajustes</h1>
    </header>
    <main aria-hidden="true">
      <p class="label">Respaldo</p>
      <div class="card">
        <div class="row">Exportar respaldo</div>
        <div class="row">Importar respaldo</div>
      </div>
    </main>

    <div class="sheetscrim">
      <section class="sheet" role="alertdialog" aria-labelledby="t" aria-describedby="d">
        <div class="grab" aria-hidden="true"></div>
        <h2 id="t">Reemplazar el estado actual</h2>
        <span class="subject">respaldo-2026-11-01.json</span>
        <p id="d">Se borrará tu biblioteca, progreso y ajustes actuales y se restaurarán los del respaldo. Esta acción no se puede deshacer.</p>
        <div class="stack">
          <button class="btn caution block">
            <svg class="i sm" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            Reemplazar
          </button>
          <button class="btn block">Cancelar</button>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
