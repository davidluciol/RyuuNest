<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico · Confirmar borrado — Dragon Night (FB2)</title>
  <link rel="stylesheet" href="../_shared/dragon-night.css">
</head>
<body>
  <div class="phone" style="overflow:hidden;max-height:100vh">
    <header class="topbar">
      <button class="iconbtn" aria-label="Volver">
        <svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h1>Diagnóstico</h1>
    </header>
    <main aria-hidden="true">
      <p class="lead">Registro local de errores de esta app. Se guarda solo en este dispositivo y nada se envía.</p>
      <div class="card" style="height:220px"></div>
    </main>

    <div class="scrim">
      <section class="dialog" role="alertdialog" aria-labelledby="t" aria-describedby="d">
        <h2 id="t">¿Borrar el registro?</h2>
        <p id="d">Se eliminarán los 4 eventos guardados en este dispositivo. Esta acción no se puede deshacer.</p>
        <div class="actions">
          <button class="btn">Cancelar</button>
          <button class="btn destructive">
            <svg class="i sm" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            Borrar registro
          </button>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
